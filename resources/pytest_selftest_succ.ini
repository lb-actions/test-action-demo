[pytest]
# 日志配置：目录、级别
infra_log_dir = logs
infra_log_level = INFO

pythonpath = .

# 指定测试文件搜索路径（可提升收集速度，避免扫描无关目录）
testpaths = tests/selftest

# 默认命令行选项（每次运行 pytest 时自动应用）
addopts =
    -v
    --tb=short


# 注册自定义 markers（避免使用未声明的 marker 产生警告）
markers =
    smoke: 标记冒烟测试用例
    ui: UI 自动化测试
    api: 接口测试

# 忽略某些文件或目录（可选）
; ignore =
;     tests/old/
;     tests/conftest_legacy.py

# 指定 Python 文件匹配模式
; python_files = test_tensor_compare.py

# 指定测试类和函数的命名规则
python_classes = TestDemoExecutionSucc
python_functions = test_*

# 自定义用例筛选条件，对应用例的自定义mark中的case_info信息
[case_info]
;pretest = [tc_1, tc_2]         # 前置必须执行的用例
;level = [P0, P1]
;type = [Functional, Perf]
;scene = [BEP, PD_SEP]
;feature = [feature_1, feature_2]

# 用例id列表筛选条件，使用用例函数名筛选，多个用例函数名使用英文逗号隔开不要带空格
[test_ids]
;include = id1,id2
;exclude = id3,id4


