name: precision-test-demo

on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC 换证（OBS 上传/下载）
  contents: read

jobs:
  precision-test:
    name: 精准测试覆盖率上传与用例选择
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # 下载历史覆盖率 tar 包作为上传素材（公开直链，仅作演示数据源）
      - name: Download coverage tar as upload material
        run: |
          set -e
          curl -fSL --retry 3 -o coverage.tar \
            "https://vllm-ascend.obs.cn-north-4.myhuaweicloud.com/ci/precision-test/coverage.tar"
          ls -lh coverage.tar

      # 阶段一（A 模式）：上传 tar 到 OBS → 解压解析（自动发现覆盖率根目录与内置 covstub）
      # → 生成 test_case_map.json → 上传 map → 清空追加表
      - name: upload-coverage-and-build-map
        id: upload
        uses: lb-actions/precision-test@261010-update-test
        with:
          repo: vllm_ascend
          coverage-tar-path: coverage.tar
          project-name: vllm-ascend
          obs-bucket-name: op-case-result
          map-file: test_case_map.json
          # GitHub 平台换证组合（与 main 分支 obs-sdk 测试通过的一致）：
          # GitHubActions 提供商 + github-actions 委托（SDK 默认的 gitcode-actions 委托未放行该提供商）
          oidc-config: '{"oidcProviderName":"GitHubActions","agencyName":"github-actions","debug":true}'
        env:
          PYTHON_EXEC_TIMEOUT_SECONDS: "1800"
          MAX_COVERAGE_TAR_SIZE_MB: "2048" # 演示tar包572MB，放宽大小闸门（上传已改为流式，无内存风险）

      - name: 显示上传结果
        run: |
          echo "upload-success: ${{ steps.upload.outputs.upload-success }}"
          echo "obs-url: ${{ steps.upload.outputs.obs-url }}"
          echo "PRECISION_SOURCE_DIR: ${{ env.PRECISION_SOURCE_DIR }}"
          echo "PRECISION_COVERAGE_DIR: ${{ env.PRECISION_COVERAGE_DIR }}"

      # 阶段二：用刚生成的本地 map + PR diff 做用例选择
      # （C 模式默认开启：同时下载 OBS 追加表并合并进推荐列表，验证 OIDC 读链路）
      - name: select-tests
        id: precision-test
        uses: lb-actions/precision-test@261010-update-test
        continue-on-error: true
        with:
          repo: vllm_ascend
          github-pr: vllm-project/vllm-ascend#14696
          source-dir: ${{ env.PRECISION_SOURCE_DIR }}
          map-file: test_case_map.json
          # 追加表下载路径必须与阶段一上传路径一致，需显式传 project-name
          #（否则回退 demo 仓库名，会去 precision/Ascend/test-action-demo/ 下找，404）
          project-name: vllm-ascend
          # 与阶段一相同的换证组合：默认 GitCodeActions 在 GitHub 平台必然换证失败
          oidc-config: '{"oidcProviderName":"GitHubActions","agencyName":"github-actions","debug":true}'
          min-affected: 1
          dedup: true
        env:
          GITHUB_TOKEN: ${{ secrets.MYTOKEN }}
          PYTHON_EXEC_TIMEOUT_SECONDS: "900"

      - name: 显示map
        run: |
          echo "=== map 内容（前50行）==="
          head -n 50 test_case_map.json

      - name: 显示推荐用例
        if: ${{ steps.precision-test.conclusion == 'success' }}
        run: |
          echo "=== 推荐用例 ==="
          cat recommended_pytest_paths.txt

      # 阶段三（D 模式）：只传 github-pr + download-coverage，验证 OBS 下载闭环
      # —— 插件从 OBS 拉取阶段一上传的 tar + map（SaveAsFile 流式落盘），解压后
      # 自动发现 covstub 与覆盖率根目录并回填，无需传 source-dir / map-file /
      # coverage-dir；同时默认合并追加表（C 模式链路复用）
      - name: select-tests-from-obs
        id: select-obs
        uses: lb-actions/precision-test@261016-download-coverage
        continue-on-error: true
        with:
          repo: vllm_ascend
          github-pr: vllm-project/vllm-ascend#14696
          download-coverage: 'true'
          # 下载路径必须与阶段一上传路径一致（precision/Ascend/vllm-ascend/）
          project-name: vllm-ascend
          # GitHub 平台换证组合（同阶段一/二）
          oidc-config: '{"oidcProviderName":"GitHubActions","agencyName":"github-actions","debug":true}'
        env:
          GITHUB_TOKEN: ${{ secrets.MYTOKEN }}
          PYTHON_EXEC_TIMEOUT_SECONDS: "900"

      - name: 显示 OBS 下载模式推荐结果
        if: ${{ steps.select-obs.conclusion == 'success' }}
        run: |
          echo "=== D 模式推荐用例 ==="
          cat recommended_pytest_paths.txt
